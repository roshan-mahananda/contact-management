<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Management - Firebase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Contact Management</h1>

        <form id="contact-form">
            <input type="text" id="name" placeholder="Name" required>
            <input type="email" id="email" placeholder="Email">
            <input type="text" id="phone" placeholder="Phone" required>
            <textarea id="address" placeholder="Address" rows="3"></textarea>
            <button type="submit" id="submit-btn">Save Contact</button>
            <button type="button" id="cancel-btn" style="display:none;">Cancel</button>
        </form>

        <h2>Saved Contacts</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="contacts-list">
            </tbody>
        </table>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
